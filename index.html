<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Network Explorer — Social Network Analysis from a CSV</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.8.5/d3.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
:root{
  --bg:#f6f7f9; --panel:#ffffff; --ink:#1b1f26; --muted:#6b7280; --line:#e3e6ea;
  --accent:#2f5fd0; --accent-soft:#eaf0fd; --warn:#b45309; --ok:#0f766e;
  --shadow:0 1px 2px rgba(16,24,40,.06),0 4px 16px rgba(16,24,40,.06);
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{
  font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  color:var(--ink); background:var(--bg); overflow:hidden;
}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3,h4{margin:0;font-weight:650;letter-spacing:-.01em}

/* ---------- shell ---------- */
#app{display:flex;height:100%}
#side{
  width:352px;min-width:352px;height:100%;background:var(--panel);
  border-right:1px solid var(--line);display:flex;flex-direction:column;
}
#brand{padding:14px 16px 12px;border-bottom:1px solid var(--line)}
#brand h1{font-size:15px}
#brand p{margin:3px 0 0;font-size:11.5px;color:var(--muted)}
#tabs{display:flex;border-bottom:1px solid var(--line);background:#fafbfc}
#tabs button{
  flex:1;padding:9px 4px;background:none;border:0;border-bottom:2px solid transparent;
  color:var(--muted);cursor:pointer;font-size:12.5px;font-weight:550;
}
#tabs button:hover{color:var(--ink)}
#tabs button.on{color:var(--accent);border-bottom-color:var(--accent);background:#fff}
#panels{flex:1;overflow-y:auto;overscroll-behavior:contain}
.panel{display:none;padding:14px 16px 32px}
.panel.on{display:block}

/* ---------- generic controls ---------- */
.sect{margin-bottom:18px}
.sect > h3{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin-bottom:8px}
.row{margin-bottom:10px}
.row > label{display:block;font-size:12px;font-weight:550;margin-bottom:4px}
.hint{font-size:11.5px;color:var(--muted);margin-top:3px;line-height:1.45}
select,input[type=text],input[type=number]{
  width:100%;padding:6px 8px;border:1px solid var(--line);border-radius:6px;background:#fff;
}
select:focus,input:focus{outline:2px solid var(--accent-soft);border-color:var(--accent)}
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:6px;
  padding:7px 12px;border:1px solid var(--line);border-radius:7px;background:#fff;
  cursor:pointer;font-size:13px;font-weight:550;
}
.btn:hover{background:#f3f5f8}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary:hover{background:#254db0}
.btn.wide{width:100%}
.btn.sm{padding:5px 9px;font-size:12px}
.btnrow{display:flex;gap:6px;flex-wrap:wrap}
.chk{display:flex;align-items:flex-start;gap:7px;margin:5px 0;font-size:12.5px;cursor:pointer}
.chk input{margin:2px 0 0}
.scrollbox{max-height:190px;overflow-y:auto;border:1px solid var(--line);border-radius:7px;padding:7px 9px;background:#fcfcfd}
.pill{display:inline-block;padding:1px 7px;border-radius:99px;background:var(--accent-soft);color:var(--accent);font-size:11px;font-weight:600}
.slider{display:flex;align-items:center;gap:8px}
.slider input[type=range]{flex:1}
.slider output{min-width:44px;text-align:right;font-variant-numeric:tabular-nums;font-size:12px;color:var(--muted)}
.note{border-left:3px solid var(--accent);background:var(--accent-soft);padding:8px 10px;border-radius:0 6px 6px 0;font-size:12px;line-height:1.5}
.note.warn{border-left-color:var(--warn);background:#fef6ec;color:#7c4a06}

/* ---------- drop zone ---------- */
#drop{
  border:2px dashed #c9d0da;border-radius:10px;padding:22px 14px;text-align:center;
  background:#fbfcfd;cursor:pointer;transition:.15s;
}
#drop:hover,#drop.hot{border-color:var(--accent);background:var(--accent-soft)}
#drop strong{display:block;font-size:13.5px;margin-bottom:3px}
#drop span{font-size:11.5px;color:var(--muted)}

/* ---------- stage ---------- */
#stage{flex:1;position:relative;background:#fff;overflow:hidden}
#cv{display:block;width:100%;height:100%}
#empty{
  position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;
  justify-content:center;gap:10px;color:var(--muted);text-align:center;padding:30px;
}
#empty svg{opacity:.25}
.overlay{position:absolute;z-index:5}
#searchwrap{top:12px;left:12px;width:250px}
#search{
  width:100%;padding:7px 10px;border:1px solid var(--line);border-radius:8px;
  background:rgba(255,255,255,.95);box-shadow:var(--shadow);
}
#hits{
  margin-top:4px;background:#fff;border:1px solid var(--line);border-radius:8px;
  box-shadow:var(--shadow);max-height:220px;overflow-y:auto;display:none;
}
#hits div{padding:6px 10px;cursor:pointer;font-size:12.5px;border-bottom:1px solid #f1f3f5}
#hits div:last-child{border-bottom:0}
#hits div:hover{background:var(--accent-soft)}
#zoomer{top:12px;right:12px;display:flex;flex-direction:column;gap:5px}
#zoomer button{
  width:32px;height:32px;border:1px solid var(--line);border-radius:8px;background:rgba(255,255,255,.95);
  cursor:pointer;font-size:15px;line-height:1;box-shadow:var(--shadow);
}
#zoomer button:hover{background:#f3f5f8}
#statusbar{
  bottom:0;left:0;right:0;padding:6px 12px;background:rgba(255,255,255,.94);
  border-top:1px solid var(--line);font-size:11.5px;color:var(--muted);
  display:flex;gap:16px;flex-wrap:wrap;
}
#statusbar b{color:var(--ink);font-weight:600;font-variant-numeric:tabular-nums}
#zoomer button.on{background:var(--accent);border-color:var(--accent);color:#fff}
#selbar{
  bottom:34px;left:50%;transform:translateX(-50%);display:none;align-items:center;gap:9px;
  background:rgba(255,255,255,.97);border:1px solid var(--line);border-radius:10px;
  padding:7px 10px;box-shadow:var(--shadow);font-size:12.5px;white-space:nowrap;
}
#selbar b{font-variant-numeric:tabular-nums;color:var(--accent)}
#selbar .sep{width:1px;height:18px;background:var(--line)}
#selbar button{
  border:1px solid var(--line);background:#fff;border-radius:6px;padding:4px 8px;
  cursor:pointer;font-size:12px;font-weight:550;
}
#selbar button:hover{background:#f3f5f8}
#selbar button.acc{background:var(--accent);border-color:var(--accent);color:#fff}
#selbar button.acc:hover{background:#254db0}
#legend{
  bottom:34px;left:12px;background:rgba(255,255,255,.95);border:1px solid var(--line);
  border-radius:8px;padding:8px 10px;box-shadow:var(--shadow);max-width:230px;
  max-height:40%;overflow-y:auto;display:none;
}
#legend h4{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin-bottom:6px}
#legend .item{display:flex;align-items:center;gap:7px;font-size:12px;margin:3px 0;cursor:pointer}
#legend .swatch{width:11px;height:11px;border-radius:50%;flex:none;border:1px solid rgba(0,0,0,.15)}
#legend .item.off{opacity:.35}
#tip{
  position:absolute;z-index:20;pointer-events:none;display:none;max-width:320px;
  background:rgba(24,28,35,.95);color:#fff;border-radius:8px;padding:8px 10px;
  font-size:12px;line-height:1.5;box-shadow:0 6px 24px rgba(0,0,0,.25);
}
#tip .t{font-weight:650;margin-bottom:4px;font-size:12.5px}
#tip .k{color:#a8b3c4}
#busy{
  position:absolute;inset:0;z-index:40;display:none;align-items:center;justify-content:center;
  background:rgba(255,255,255,.75);font-size:13px;font-weight:550;
}

/* ---------- inline help ---------- */
.help{
  display:inline-flex;align-items:center;justify-content:center;width:15px;height:15px;
  border-radius:50%;border:1px solid #c3ccd8;background:#fff;color:#7a8698;
  font-size:10.5px;font-weight:700;cursor:help;margin-inline-start:5px;vertical-align:middle;
  line-height:1;user-select:none;flex:none;
}
.help:hover,.help:focus{background:var(--accent);border-color:var(--accent);color:#fff;outline:none}
#helppop{
  position:fixed;z-index:200;max-width:330px;display:none;
  background:#fff;border:1px solid var(--line);border-radius:10px;padding:11px 13px;
  box-shadow:0 8px 30px rgba(16,24,40,.16);font-size:13px;line-height:1.6;color:#333b47;
}
#helppop b{color:var(--ink)}
#helppop code{background:#f2f4f7;border-radius:4px;padding:1px 4px;font-size:12px}

/* ---------- guided tour ---------- */
#tour{position:fixed;inset:0;z-index:300;display:none}
#tour.on{display:block}
/* the dimming is done entirely by the spotlight's huge box-shadow, so the
   highlighted element stays bright; the veil only catches stray clicks */
#tour-veil{position:absolute;inset:0;background:transparent}
#tour-hole{
  position:absolute;border-radius:10px;box-shadow:0 0 0 9999px rgba(14,18,25,.55);
  border:2px solid var(--accent);transition:all .28s cubic-bezier(.4,0,.2,1);pointer-events:none;
}
#tour-card{
  position:absolute;width:340px;background:#fff;border-radius:12px;padding:17px 19px 15px;
  box-shadow:0 16px 50px rgba(0,0,0,.3);transition:all .28s cubic-bezier(.4,0,.2,1);
}
#tour-card h4{font-size:15px;margin-bottom:6px}
#tour-card p{margin:0;font-size:13.5px;line-height:1.65;color:#3d4550}
#tour-card .tip{margin-top:9px;font-size:12.5px;color:var(--accent);background:var(--accent-soft);
  padding:7px 10px;border-radius:7px;line-height:1.55}
#tour-foot{display:flex;align-items:center;justify-content:space-between;margin-top:14px;gap:10px}
#tour-dots{display:flex;gap:5px}
#tour-dots i{width:6px;height:6px;border-radius:50%;background:#d4dae3;display:block}
#tour-dots i.on{background:var(--accent);width:16px;border-radius:3px}
#tour-foot .btn{padding:6px 12px}
#tour-skip{background:none;border:0;color:var(--muted);cursor:pointer;font-size:12.5px;text-decoration:underline}
#tour-skip:hover{color:var(--ink)}

/* ---------- modal ---------- */
#modal{
  position:fixed;inset:0;z-index:100;display:none;align-items:center;justify-content:center;
  background:rgba(20,24,31,.42);padding:24px;
}
#modal.on{display:flex}
#sheet{
  background:#fff;border-radius:12px;width:min(880px,100%);max-height:92vh;display:flex;
  flex-direction:column;box-shadow:0 20px 60px rgba(0,0,0,.28);
}
#sheet header{padding:16px 20px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}
#sheet header h2{font-size:16px}
#sheet .body{padding:18px 20px;overflow-y:auto}
#sheet footer{padding:13px 20px;border-top:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:10px}
.x{background:none;border:0;font-size:20px;cursor:pointer;color:var(--muted);line-height:1;padding:2px 6px}
.x:hover{color:var(--ink)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
@media(max-width:720px){.grid2,.grid3{grid-template-columns:1fr}}
.modecard{
  border:1.5px solid var(--line);border-radius:9px;padding:11px 13px;cursor:pointer;background:#fff;
}
.modecard:hover{border-color:#b9c4d6}
.modecard.on{border-color:var(--accent);background:var(--accent-soft)}
.modecard b{display:block;font-size:13px;margin-bottom:3px}
.modecard span{font-size:11.5px;color:var(--muted);line-height:1.45;display:block}

/* ---------- tables ---------- */
.tblwrap{overflow:auto;border:1px solid var(--line);border-radius:8px;max-height:260px}
table{border-collapse:collapse;width:100%;font-size:12px}
th,td{padding:5px 9px;border-bottom:1px solid #eef0f3;text-align:left;white-space:nowrap}
th{
  background:#f7f8fa;position:sticky;top:0;font-weight:600;font-size:11.5px;
  color:var(--muted);text-transform:uppercase;letter-spacing:.04em;z-index:1;
}
th.sortable{cursor:pointer;user-select:none}
th.sortable:hover{color:var(--ink)}
td.num{text-align:right;font-variant-numeric:tabular-nums}
tbody tr:hover{background:var(--accent-soft)}
tbody tr{cursor:pointer}

/* ---------- metric cards ---------- */
.metric{border:1px solid var(--line);border-radius:9px;margin-bottom:8px;overflow:hidden}
.metric > button{
  width:100%;display:flex;justify-content:space-between;align-items:center;gap:8px;
  padding:9px 11px;background:#fff;border:0;cursor:pointer;text-align:left;
}
.metric > button:hover{background:#f7f8fa}
.metric > button b{font-size:12.5px;font-weight:600}
.metric .why{padding:0 11px 11px;font-size:12px;color:#414855;line-height:1.55;display:none;border-top:1px solid #f0f2f5;padding-top:9px}
.metric.open .why{display:block}
.metric .why em{color:var(--accent);font-style:normal;font-weight:600}
.metric .why .formula{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11.5px;background:#f6f7f9;padding:5px 7px;border-radius:5px;display:block;margin:6px 0}
.stat{display:flex;justify-content:space-between;padding:5px 0;border-bottom:1px dashed #eceff3;font-size:12.5px}
.stat:last-child{border-bottom:0}
.stat b{font-variant-numeric:tabular-nums}
.caret{color:var(--muted);font-size:11px;transition:transform .15s}
.metric.open .caret{transform:rotate(90deg)}
</style>
</head>
<body>
<div id="app">
  <aside id="side">
    <div id="brand">
      <div style="display:flex;align-items:flex-start;justify-content:space-between;gap:10px">
        <div>
          <h1>Network Explorer</h1>
          <p>Social network analysis from a CSV — everything runs in your browser.</p>
        </div>
        <button class="btn sm" id="guide" title="Take the tour of the interface"
          style="flex:none;padding:5px 10px">Guide</button>
      </div>
    </div>
    <nav id="tabs">
      <button data-tab="data" class="on">Data</button>
      <button data-tab="style">Style</button>
      <button data-tab="analysis">Analysis</button>
      <button data-tab="export">Export</button>
    </nav>
    <div id="panels">
      <section class="panel on" data-panel="data"></section>
      <section class="panel" data-panel="style"></section>
      <section class="panel" data-panel="analysis"></section>
      <section class="panel" data-panel="export"></section>
    </div>
  </aside>

  <main id="stage">
    <canvas id="cv"></canvas>
    <div id="empty">
      <svg width="72" height="72" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.3">
        <circle cx="5" cy="6" r="2.2"/><circle cx="19" cy="7" r="2.2"/><circle cx="12" cy="13" r="2.6"/>
        <circle cx="6" cy="19" r="2.2"/><circle cx="18" cy="18" r="2.2"/>
        <path d="M7 6.6 9.8 12M16.9 8 14 11.6M10.4 15 7.6 17.2M14 14.8l2.6 2"/>
      </svg>
      <div><strong>No network loaded</strong><br><span style="font-size:12.5px">Upload a CSV in the Data tab, or load the example dataset.</span></div>
    </div>
    <div class="overlay" id="searchwrap">
      <input id="search" type="text" placeholder="Search for a node…" autocomplete="off" spellcheck="false">
      <div id="hits"></div>
    </div>
    <div class="overlay" id="zoomer">
      <button id="zin" title="Zoom in">+</button>
      <button id="zout" title="Zoom out">−</button>
      <button id="zfit" title="Fit to screen" style="font-size:12px">⤢</button>
      <button id="zsel" title="Marquee select — drag a box around nodes (or hold Shift and drag)" style="font-size:13px">▨</button>
    </div>
    <div class="overlay" id="selbar"></div>
    <div class="overlay" id="legend"></div>
    <div class="overlay" id="statusbar"></div>
    <div id="tip"></div>
    <div id="busy">Working…</div>
  </main>
</div>

<div id="helppop"></div>
<div id="tour">
  <div id="tour-veil"></div>
  <div id="tour-hole"></div>
  <div id="tour-card">
    <h4 id="tour-title"></h4>
    <p id="tour-text"></p>
    <div class="tip" id="tour-tip" style="display:none"></div>
    <div id="tour-foot">
      <button id="tour-skip">Skip</button>
      <div id="tour-dots"></div>
      <span style="display:flex;gap:6px">
        <button class="btn sm" id="tour-back">Back</button>
        <button class="btn sm primary" id="tour-next">Next</button>
      </span>
    </div>
  </div>
</div>

<div id="modal"><div id="sheet">
  <header><h2 id="sheet-title">Map your columns</h2><button class="x" id="sheet-x">×</button></header>
  <div class="body" id="sheet-body"></div>
  <footer>
    <span id="sheet-note" class="hint"></span>
    <span style="display:flex;gap:8px">
      <button class="btn" id="sheet-cancel">Cancel</button>
      <button class="btn primary" id="sheet-ok">Build network</button>
    </span>
  </footer>
</div></div>

const esc = s => String(s == null ? "" : s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const fmt = (v, d = 3) => {
  if (v == null || Number.isNaN(v)) return "—";
  if (Number.isInteger(v)) return v.toLocaleString();
  if (Math.abs(v) >= 1000) return v.toLocaleString(undefined, { maximumFractionDigits: 1 });
  if (Math.abs(v) < 0.001 && v !== 0) return v.toExponential(2);
  return (+v).toFixed(d).replace(/\.?0+$/, "");
};
const busy = (on, msg = "Working…") => {
  const b = document.getElementById("busy");

/* Yield to the browser so the "Working…" overlay can paint before a long
   computation starts. requestAnimationFrame is throttled to a standstill in a
   background tab, so a plain rAF await would never resolve and the overlay
   would hang forever if the user switched tabs — hence the timeout race. */
const nextFrame = () => new Promise(r => {
  let settled = false;
  const done = () => { if (!settled) { settled = true; r(); } };
  requestAnimationFrame(() => requestAnimationFrame(done));
  setTimeout(done, 50);
});

const PALETTE = ["#2f5fd0", "#e4572e", "#17a398", "#8f4bd8", "#e8a33d", "#2a9d3f", "#d1467f",
  "#5b7fa6", "#a6761d", "#6a8f2f", "#c33c54", "#3d8bbf", "#8c6c9e", "#b07d4c",
  "#4c9f8a", "#c9563c", "#7a7fbf", "#9d8b3f"];

function download(filename, blobOrString, mime = "text/plain;charset=utf-8") {
  const blob = blobOrString instanceof Blob ? blobOrString : new Blob(["﻿" + blobOrString], { type: mime });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 2000);
}

/* Math.max(...huge) overflows the stack — these stay safe on big graphs. */
function maxOf(arr, get = v => v, seed = -Infinity) {
  let m = seed;
  for (const v of arr) { const x = get(v); if (x > m) m = x; }
  return m;
}
function minOf(arr, get = v => v, seed = Infinity) {
  let m = seed;
  for (const v of arr) { const x = get(v); if (x < m) m = x; }
  return m;
}

function toCSV(rows, cols) {
  const q = v => {
    const s = v == null ? "" : String(v);
    return /[",\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
  };
  return [cols.join(","), ...rows.map(r => cols.map(c => q(r[c])).join(","))].join("\n");
}

/* ============================================== INLINE HELP (the ? chips) == */
/* Short, plain answers to "what is this and why would I touch it". Attached to

const HELP = {
  mode: `<b>How each row is read.</b> If a row already names two people who are connected, that is an
    <b>edge list</b>. If a row says "this person took part in this thing", that is a
    <b>co-occurrence list</b> — everyone sharing a document, meeting or event gets linked, and the edge
    weight counts how many they share. Most spreadsheets in the humanities are the second kind.`,
  weight: `<b>How strong a tie is.</b> The default counts how often the two appear together. Choosing a
    number column instead sums that column. Weight drives edge thickness, the threshold slider, and
    (optionally) the distance used by betweenness and closeness.`,
  agg: `<b>When the same pair appears twice.</b> Two rows linking the same two people are merged into one
    edge. This decides whether the weights add up, or the largest wins, or they are averaged.`,
  directed: `<b>Does direction matter?</b> Tick this only if A→B means something different from B→A —
    a letter sent, a payment made, a citation. Kinship, co-signing and co-appearance are not directed.`,
  nodeinfo: `<b>What you see when hovering a node.</b> Pick the columns worth reading at a glance. When a
    person has several different values in a column, the most frequent one is shown.`,
  edgeinfo: `<b>What you see when hovering a link.</b> In co-occurrence mode this is where the shared
    documents or events are listed — usually the most useful thing on the screen.`,
  attrs: `<b>A second table, one row per node.</b> The edge table rarely carries a person's sect, gender,
    origin or dates. Adding them here unlocks colouring, filtering and the homophily test. Rows are matched
    by name, ignoring case and spacing.`,
  weightpull: `<b>Does a stronger tie sit closer?</b> At 0 every link is drawn the same length and only the
    pattern of connections shapes the picture. Turning it up makes a pair who share many documents settle
    close together and a pair who share one drift apart, so distance on screen starts to carry meaning.
    <b>Watch out.</b> Distance in a force layout is never a measurement — it is a compromise between every
    link at once. Use it to make structure visible, not to read off numbers.`,
  layout: `<b>Where the nodes sit.</b> Force-directed pulls connected nodes together and pushes the rest
    apart, so clusters appear by themselves. Positions have no units — only relative closeness means
    anything, and every re-run gives a slightly different picture of the same structure.
    <b>Core and periphery</b> answers a different question: it puts the highest-scoring nodes at the centre
    and the weakly attested on the rim, at a radius set by whichever metric drives node size. It is a
    ranking you can see, rather than an emergent shape.`,
  components: `<b>Pieces that never touch.</b> Most real networks are not one connected lump. Narrowing the
    view to a single component lets the layout spread it out properly instead of squashing it beside
    everything else.`,
  threshold: `<b>The most useful control here.</b> Hides ties below a weight. On a co-occurrence network,
    where every document is already a complete clique, raising this until the picture becomes readable is

  colour: `<b>Colour carries a category.</b> Any attribute with a manageable number of values can be used.

  size: `<b>Size carries a number.</b> Metrics appear in this list once you compute them in the Analysis

  labels: `<b>Names on the canvas.</b> Showing all of them is unreadable above about fifty nodes, so the

  weighted: `<b>Should weight count as distance?</b> With this on, a heavier tie is treated as a
    <i>shorter</i> distance (1 ÷ weight) when betweenness and closeness look for shortest paths — the

  overview: `<b>The shape of the whole network.</b> Density is the share of possible links that exist.
    Path length and diameter are counted in hops inside the largest component. Degree assortativity is

  ranking: `<b>Everyone, sorted.</b> Click a row to fly to that node; shift-click to mark it for export.
    Reading two different metrics down this list side by side is where most findings start.`,
  marked: `<b>A group you carved out by hand.</b> Shift-drag a box on the canvas, or shift-click nodes one

  picture: `<b>Exports exactly what is on screen</b> — same zoom, same filters, same labels. Arrange the

function helpChip(k) {

    pop.style.left = left + "px";

  const hide = () => { hideTimer = setTimeout(() => pop.style.display = "none", 120); };
  document.addEventListener("mouseover", e => {

  document.addEventListener("mouseout", e => { if (e.target.closest?.(".help")) hide(); });
  document.addEventListener("focusin", e => { if (e.target.closest?.(".help")) show(e.target); });
  document.addEventListener("focusout", e => { if (e.target.closest?.(".help")) hide(); });
  pop.addEventListener("mouseenter", () => clearTimeout(hideTimer));

})();

/* --------------------------------------------------------- file reading -- */
/* Excel's "Save as CSV" writes the system's legacy code page, not UTF-8, so a
   Hebrew or Arabic spreadsheet saved that way arrives as mojibake. Rather than
   telling people to re-save, decode the bytes ourselves: try UTF-8 strictly,
   and on failure fall back through the code pages those languages actually use. */
const TEXT_ENCODINGS = ["utf-8", "windows-1255", "windows-1256", "windows-1251", "windows-1252"];
function decodeText(buf) {
  for (const enc of TEXT_ENCODINGS) {
    try {
      const txt = new TextDecoder(enc, { fatal: true }).decode(buf);
      return { txt, enc };
    } catch (e) { /* not this one */ }
  }
  return { txt: new TextDecoder("utf-8").decode(buf), enc: "utf-8 (with replacement characters)" };
}

const isSpreadsheet = name => /\.(xlsx|xlsm|xltx|xls)$/i.test(name);

function tableFromText(text, name, note) {
  const res = Papa.parse(text.replace(/^﻿/, "").trim(), {
    header: true, skipEmptyLines: "greedy", dynamicTyping: false
  });
  const fields = (res.meta.fields || []).map(s => (s || "").replace(/^﻿/, "").trim()).filter(Boolean);
  if (!fields.length) return null;
  const rows = res.data.map(r => {
    const o = {};
    for (const k in r) o[(k || "").replace(/^﻿/, "").trim()] = r[k];
    return o;
  }).filter(r => fields.some(f => String(r[f] ?? "").trim() !== ""));
  return { rows, fields, name, note };
}

function readFile(f, cb) {
  busy(true, "Reading " + f.name + "…");
  const fr = new FileReader();
  fr.onerror = () => { busy(false); alert("Could not read the file."); };
  fr.onload = () => {
    const buf = fr.result;
    try {
      if (isSpreadsheet(f.name)) return readWorkbook(buf, f.name, cb);
      const { txt, enc } = decodeText(buf);
      const t = tableFromText(txt, f.name, enc === "utf-8" ? "" : `decoded as ${enc}`);
      busy(false);
      if (!t) return alert("No columns found. Does the first row hold the column names?");
      if (enc !== "utf-8") toast(`This file was not saved as UTF-8, so the text would normally arrive as “????”. ` +
        `Read it as ${enc} instead — check that the names below look right.`);
      cb(t);
    } catch (err) { busy(false); alert("Could not read the file: " + err.message); }
  };
  fr.readAsArrayBuffer(f);
}

/** Excel files: read every sheet, use the only one, or let the user choose. */
function readWorkbook(buf, name, cb) {
  if (typeof XLSX === "undefined") {
    busy(false);
    return alert("The spreadsheet reader did not load. Check your internet connection, or save the file as CSV UTF-8.");
  }
  const wb = XLSX.read(buf, { type: "array" });
  const sheets = wb.SheetNames.map(sn => {
    const csv = XLSX.utils.sheet_to_csv(wb.Sheets[sn], { blankrows: false });
    return { sn, csv, table: tableFromText(csv, `${name} — ${sn}`, "from Excel") };
  }).filter(s => s.table && s.table.rows.length);
  busy(false);
  if (!sheets.length) return alert("No sheet in this workbook has a header row and data under it.");
  if (sheets.length === 1) { toast(`Read the sheet “${sheets[0].sn}” — ${sheets[0].table.rows.length.toLocaleString()} rows.`); return cb(sheets[0].table); }
  openModal("Which sheet?", `
    <p class="hint" style="margin-bottom:12px">${esc(name)} has ${sheets.length} sheets with data in them.</p>
    ${sheets.map((s, i) => `<div class="modecard ${i === 0 ? "on" : ""}" data-sheet="${i}" style="margin-bottom:8px">
        <b>${esc(s.sn)}</b>
        <span>${s.table.rows.length.toLocaleString()} rows · ${s.table.fields.length} columns ·
          ${esc(s.table.fields.slice(0, 5).join(", "))}${s.table.fields.length > 5 ? " …" : ""}</span>
      </div>`).join("")}`,
    () => {
      const i = +$(".modecard.on").dataset.sheet;
      closeModal();
      cb(sheets[i].table);
    }, "Use this sheet");
  $$(".modecard").forEach(c => c.onclick = () => $$(".modecard").forEach(x => x.classList.toggle("on", x === c)));
}

function parseCSVText(text, name) {
  const res = Papa.parse(text.trim(), { header: true, skipEmptyLines: "greedy" });
  const fields = (res.meta.fields || []).map(s => s.trim());
  return { rows: res.data, fields, name };
}

  S.attrRaw = parseCSVText($("#demo-persons").textContent, "karaite_persons.csv (example)");
  S.map = {
    mode: "co", a: "person", b: "shelfmark", weightCol: "__count__", agg: "sum", directed: false,
    nodeInfo: ["role", "place", "doc_type"], edgeInfo: ["shelfmark", "year_est", "place"],
    attrKey: "canonical_name", attrCols: ["sect", "gender", "num_docs", "year_min", "year_max", "origin_or_nisba_place"]
  };

let toastTimer = null;

      "max-width:520px;box-shadow:0 8px 28px rgba(0,0,0,.25);text-align:center";
    STAGE.appendChild(el);

}

/* ======================================================= COLUMN MAPPING === */
function guessCol(fields, patterns, fallbackIdx) {
  for (const p of patterns) {
    const hit = fields.find(f => new RegExp(p, "i").test(f));
    if (hit) return hit;
  }
  return fields[fallbackIdx] ?? fields[0];
}

/* ========================================================= GRAPH BUILD === */
const normKey = s => String(s ?? "").trim().toLowerCase().replace(/\s+/g, " ");

function build() {
  busy(true, "Building the network…");
  const m = S.map, rows = S.raw.rows;
  const nodes = new Map();   // key -> node
  const linkMap = new Map(); // "a␀b" -> link

  const getNode = (name) => {
    const k = normKey(name);
    if (!nodes.has(k)) nodes.set(k, {
      id: k, label: String(name).trim(), attrs: {}, _info: {}, m: {},
      x: 0, y: 0, fx: null, fy: null, groups: new Set()
    });
    return nodes.get(k);
  };
  const noteInfo = (node, row) => {
    for (const c of m.nodeInfo) {
      const v = String(row[c] ?? "").trim();
      if (!v) continue;
      (node._info[c] ||= new Map()).set(v, (node._info[c]?.get(v) || 0) + 1);
    }
  };
  // A weight column that turns out not to be numeric would silently make every
  // edge weigh zero — count the failures so we can say so instead.
  let badWeights = 0;
  const wOf = row => {
    if (m.weightCol === "__count__") return 1;
    const v = parseFloat(row[m.weightCol]);
    if (!Number.isFinite(v)) { badWeights++; return 0; }
    return v;
  };

  const addLink = (na, nb, w, row, group) => {
    let s = na.id, t = nb.id;
    if (!(m.mode === "edges" && m.directed) && s > t) { const x = s; s = t; t = x; }
    const key = s + "␀" + t;
    let L = linkMap.get(key);
    if (!L) {
      L = { s, t, w: 0, n: 0, _w: [], info: {}, groups: [] };
      linkMap.set(key, L);
    }
    L.n++; L._w.push(w);
    if (group != null) L.groups.push(group);
    if (row) for (const c of m.edgeInfo) {
      const v = String(row[c] ?? "").trim();
      if (v && (L.info[c] ||= []).length < 40 && !L.info[c].includes(v)) L.info[c].push(v);
    }
    return L;
  };

  if (m.mode === "edges") {
    for (const r of rows) {
      const av = String(r[m.a] ?? "").trim(), bv = String(r[m.b] ?? "").trim();
      if (!av || !bv || normKey(av) === normKey(bv)) continue;   // skip blanks and self-loops
      const na = getNode(av), nb = getNode(bv);
      noteInfo(na, r); noteInfo(nb, r);
      addLink(na, nb, wOf(r), r, null);
    }
  } else {
    // two-mode: bucket rows by group, then connect every pair inside a bucket
    const groups = new Map();
    for (const r of rows) {
      const av = String(r[m.a] ?? "").trim(), gv = String(r[m.b] ?? "").trim();
      if (!av || !gv) continue;
      const na = getNode(av);
      noteInfo(na, r);
      na.groups.add(gv);
      (groups.get(gv) || groups.set(gv, []).get(gv)).push({ node: na, row: r });
    }
    let pairCount = 0;
    for (const [gv, members] of groups) {
      // de-duplicate a person appearing twice in the same group
      const seen = new Map();
      for (const mem of members) if (!seen.has(mem.node.id)) seen.set(mem.node.id, mem);
      const list = [...seen.values()];
      pairCount += list.length * (list.length - 1) / 2;
      if (list.length > 400) continue;      // a single group that huge would blow up the graph
      for (let i = 0; i < list.length; i++)
        for (let j = i + 1; j < list.length; j++) {
          const w = m.weightCol === "__count__" ? 1 : Math.min(wOf(list[i].row), wOf(list[j].row));
          const L = addLink(list[i].node, list[j].node, w, list[i].row, gv);
          for (const c of m.edgeInfo) {
            const v = String(list[j].row[c] ?? "").trim();
            if (v && (L.info[c] ||= []).length < 40 && !L.info[c].includes(v)) L.info[c].push(v);
          }
        }
    }
    S.pairCount = pairCount;
  }

  // finalise weights
  for (const L of linkMap.values()) {
    const a = L._w;
    L.w = m.agg === "sum" ? a.reduce((x, y) => x + y, 0)
      : m.agg === "max" ? maxOf(a)
        : m.agg === "mean" ? a.reduce((x, y) => x + y, 0) / a.length
          : a[0];
    delete L._w;
  }

  // condense the most-frequent hover value per node
  for (const n of nodes.values()) {
    for (const c in n._info) {
      const sorted = [...n._info[c].entries()].sort((x, y) => y[1] - x[1]);
      n.attrs[c] = sorted[0][0] + (sorted.length > 1 ? ` (+${sorted.length - 1} more)` : "");
    }
    delete n._info;
    if (n.groups.size) { n.attrs["# groups"] = n.groups.size; }
    n.groups = [...n.groups];
  }

  const nodeList = [...nodes.values()];
  const byId = new Map(nodeList.map(n => [n.id, n]));
  const links = [...linkMap.values()].map(L => ({ ...L, source: byId.get(L.s), target: byId.get(L.t) }));

  S.G = { nodes: nodeList, links, byId };
  indexGraph();
  seedLayout();
  if (S.attrRaw && S.map.attrKey) attachAttributes();

  S.metricsDone.clear(); S.stats = null; S.selected = null;
  S.picked.clear(); S.view.onlyPicked = false;
  // the previous network's metrics and component numbers are gone; anything
  // pointing at them would silently render grey or filter to nothing
  if (S.view.colorBy === "__community__") S.view.colorBy = "__none__";
  if (!["__uniform__", "degree", "strength"].includes(S.view.sizeBy)) S.view.sizeBy = "degree";
  if (S.view.colorBy !== "__none__" && !attributeKeys().includes(S.view.colorBy)) S.view.colorBy = "__none__";
  S.view.compFilter = null;
  S.rankBy = null;
  S.view.threshold = 0;
  S.view.hidden.clear();
  computeBasics();
  $("#empty").style.display = nodeList.length ? "none" : "flex";
  busy(false);

  // say something useful instead of leaving the user with a blank canvas
  if (!nodeList.length) {
    toast(`No nodes came out of “${S.raw.name}”. Check that “${m.a}” and “${m.b}” are the right columns — ` +
      `rows where either is blank, or where both hold the same name, are skipped.`);
  } else if (!links.length) {
    toast(m.mode === "co"
      ? `${nodeList.length} nodes but no links: nothing in “${m.b}” is shared by two different “${m.a}” values.`
      : `${nodeList.length} nodes but no links — every row paired a name with itself.`);
  } else if (badWeights) {
    toast(`${badWeights.toLocaleString()} of ${rows.length.toLocaleString()} rows have no number in ` +
      `“${m.weightCol}”, so those edges weigh 0. Switch the weight back to “count of shared rows” if that is wrong.`);
  } else if (S.pairCount > 250000) {
    toast("This is a dense co-occurrence network — use the weight threshold in Style to thin it out.");
  }
}

function indexGraph() {
  const { nodes, links } = S.G;
  const adj = new Map(nodes.map(n => [n.id, []]));
  for (const L of links) {
    adj.get(L.s).push({ o: L.t, w: L.w, L, out: true });
    adj.get(L.t).push({ o: L.s, w: L.w, L, out: false });
  }
  S.G.adj = adj;
  for (const n of nodes) {
    const nb = adj.get(n.id);
    n.deg = nb.length;
    n.str = nb.reduce((a, e) => a + e.w, 0);
  }
  // connected components — the layout needs them so that small fragments and
  // isolated nodes stay near the picture instead of being flung to the rim
  const seen = new Set();
  let cid = 0;
  for (const start of nodes) {
    if (seen.has(start.id)) continue;
    const stack = [start.id], members = [];
    seen.add(start.id);
    while (stack.length) {
      const id = stack.pop();
      members.push(id);
      for (const e of adj.get(id)) if (!seen.has(e.o)) { seen.add(e.o); stack.push(e.o); }
    }
    for (const id of members) {
      const nd = S.G.byId.get(id);
      nd.comp = cid; nd.compSize = members.length;
    }
    cid++;
  }
  S.G.componentCount = cid;
  S._bigComp = null;
}

function attachAttributes() {
  if (!S.attrRaw || !S.map.attrKey) return;
  const idx = new Map();
  for (const r of S.attrRaw.rows) {
    const k = normKey(r[S.map.attrKey]);
    if (k && !idx.has(k)) idx.set(k, r);
  }
  let hit = 0;
  for (const n of S.G.nodes) {
    const r = idx.get(n.id);
    if (!r) continue;
    hit++;
    for (const c of (S.map.attrCols || [])) {
      const v = String(r[c] ?? "").trim();
      if (v) n.attrs[c] = v;
    }
  }
  S.attrMatched = hit;
}

function computeBasics() {
  for (const n of S.G.nodes) { n.m.degree = n.deg; n.m.strength = n.str; }
  S.metricsDone.add("degree"); S.metricsDone.add("strength");
}

/* --------------------------------------------------------- attribute list -- */
function attributeKeys() {
  const keys = new Set();
  for (const n of S.G?.nodes || []) for (const k in n.attrs) keys.add(k);
  return [...keys];
}
function categoricalKeys() {
  // attributes with a manageable number of distinct values
  return attributeKeys().filter(k => {
    const vals = new Set(S.G.nodes.map(n => n.attrs[k]).filter(v => v != null && v !== ""));
    return vals.size > 1 && vals.size <= 40;
  });
}
function valuesOf(key) {
  const c = new Map();
  for (const n of S.G.nodes) {
    const v = n.attrs[key];
    if (v == null || v === "") continue;
    c.set(v, (c.get(v) || 0) + 1);
  }
  return [...c.entries()].sort((a, b) => b[1] - a[1]);
}
function applyColours() {
  S.palette = {};
  const key = S.view.colorBy;
  if (key === "__none__" || key === "__community__") return;
  valuesOf(key).forEach(([v], i) => S.palette[v] = PALETTE[i % PALETTE.length]);
}
/* ========================================================== LAYOUT ======= */
function seedLayout() {
  const n = S.G.nodes.length, R = 40 + Math.sqrt(n) * 26;
  S.G.nodes.forEach((d, i) => {
    const a = i * 2.399963229728653;            // golden-angle spread
    d.x = Math.cos(a) * R * Math.sqrt(i / n + .02);
    d.y = Math.sin(a) * R * Math.sqrt(i / n + .02);
    d.vx = d.vy = 0;
  });
}

function runLayout(kind = S.view.layout) {
  if (!S.G) return;
  S.view.layout = kind;
  if (S.sim) { S.sim.stop(); S.sim = null; }
  const { nodes } = S.G;
  const links = visibleLinks();
  const n = nodes.length;

  if (kind === "circle") {
    const order = [...nodes].sort((a, b) =>
      (b.m[S.view.sizeBy] ?? b.deg) - (a.m[S.view.sizeBy] ?? a.deg));
    const R = 60 + n * 3.2;
    order.forEach((d, i) => {
      const a = (i / n) * Math.PI * 2 - Math.PI / 2;
      d.x = Math.cos(a) * R; d.y = Math.sin(a) * R; d.fx = d.fy = null;
    });
    fit(); draw(); return;
  }

  if (kind === "grid") {
    const key = S.view.colorBy === "__none__" ? "__community__" : S.view.colorBy;
    const groups = new Map();
    for (const d of nodes) {
      const g = key === "__community__" ? (d.m.community ?? 0) : (d.attrs[key] ?? "—");
      (groups.get(g) || groups.set(g, []).get(g)).push(d);
    }
    const gs = [...groups.entries()].sort((a, b) => b[1].length - a[1].length);
    const cols = Math.ceil(Math.sqrt(gs.length));
    const cell = 130 + Math.sqrt(n) * 22;
    gs.forEach(([, members], gi) => {
      const cx = (gi % cols) * cell - (cols - 1) * cell / 2;
      const cy = Math.floor(gi / cols) * cell - (Math.ceil(gs.length / cols) - 1) * cell / 2;
      const r = 8 + Math.sqrt(members.length) * 9;
      members.forEach((d, i) => {
        const a = (i / members.length) * Math.PI * 2;
        const rr = r * (0.35 + 0.65 * Math.sqrt((i + 1) / members.length));
        d.x = cx + Math.cos(a) * rr; d.y = cy + Math.sin(a) * rr; d.fx = d.fy = null;
      });
    });
    fit(); draw(); return;
  }

  if (kind === "radial") {
    // Core and periphery: distance from the centre is set by a metric, so the
    // people who appear once sit on the rim and the well-connected sit in the
    // middle. Angle is grouped by community (or the colour attribute) so that
    // the ring is not an arbitrary scatter.
    const key = S.sizeExtent?.[S.view.sizeBy] ? S.view.sizeBy : "degree";
    const ext = S.sizeExtent?.[key] || [0, 1];
    const groupOf = d => S.view.colorBy === "__community__" ? (d.m.community ?? 0)
      : S.view.colorBy !== "__none__" ? (d.attrs[S.view.colorBy] ?? "—") : 0;
    const groups = [...new Set(nodes.map(groupOf))];
    const gi = new Map(groups.map((g, i) => [g, i]));
    const R = 90 + n * 2.1;
    // order inside each wedge by the metric so the ring is tidy
    const byGroup = new Map(groups.map(g => [g, []]));
    for (const d of nodes) byGroup.get(groupOf(d)).push(d);
    for (const [g, list] of byGroup) {
      list.sort((a, b) => (b.m[key] ?? 0) - (a.m[key] ?? 0));
      const span = (2 * Math.PI) / groups.length;
      const base = gi.get(g) * span;
      list.forEach((d, i) => {
        const v = ext[1] > ext[0] ? ((d.m[key] ?? 0) - ext[0]) / (ext[1] - ext[0]) : 0;
        const r = R * (1 - Math.sqrt(v)) + 26;          // high metric → near the centre
        const a = base + span * ((i + 0.5) / list.length) * 0.92;
        d.x = Math.cos(a) * r; d.y = Math.sin(a) * r; d.fx = d.fy = null;
      });
    }
    // a short relaxation so labels stop colliding, without destroying the rings
    const rl = d3.forceSimulation(nodes)
      .force("collide", d3.forceCollide(d => radiusOf(d) + 3).iterations(3))
      .force("r", d3.forceRadial(d => {
        const v = ext[1] > ext[0] ? ((d.m[key] ?? 0) - ext[0]) / (ext[1] - ext[0]) : 0;
        return R * (1 - Math.sqrt(v)) + 26;
      }).strength(.8))
      .stop();
    for (let i = 0; i < 120; i++) rl.tick();
    fit(); draw(); return;
  }

  // force-directed.
  // Two things keep a dense co-occurrence graph from collapsing into a blob:
  //  · link strength is divided by the smaller endpoint degree (d3's own rule),
  //    so a hub with 60 links is not dragged inward 60 times as hard;
  //  · repulsion scales with the drawn radius, so big nodes claim more room.
  // A weak pull toward the origin — stronger for small fragments — keeps
  // isolates and two-node components orbiting close instead of defining the
  // extent of the whole picture.
  const maxW = Math.max(1, maxOf(links, l => l.w));
  const home = componentHomes(nodes);
  S.sim = d3.forceSimulation(nodes)
    .force("link", d3.forceLink(links).id(d => d.id)
      // A tie carrying more shared documents is drawn shorter. The spread is
      // controllable because on some data the difference should dominate the
      // picture and on others it should barely show.
      .distance(l => {
        const pull = S.view.weightPull;                 // 0 = ignore weight, 1 = strong
        const t = maxW > 1 ? (l.w - 1) / (maxW - 1) : 0;
        return 24 + (26 + 90 * pull) * (1 - t * pull);
      })
      .strength(l => (0.25 + 0.5 * (l.w / maxW)) /
        Math.max(1, Math.min(l.source.deg || 1, l.target.deg || 1))))
    .force("charge", d3.forceManyBody()
      .strength(d => -(38 + 11 * radiusOf(d)) * (1 + 40 / Math.sqrt(Math.max(n, 4))))
      .distanceMax(900).theta(0.9))
    .force("x", d3.forceX(d => home.get(d.comp ?? 0)[0]).strength(d => home.get(d.comp ?? 0)[2]))
    .force("y", d3.forceY(d => home.get(d.comp ?? 0)[1]).strength(d => home.get(d.comp ?? 0)[2]))
    .force("collide", d3.forceCollide(d => radiusOf(d) + 3).iterations(2))
    .alpha(1).alphaDecay(0.018)
    .on("tick", draw)
    .on("end", () => { draw(); });

  if (S.view.layout === "communities" && S.metricsDone.has("community")) {
    const cs = new Map();
    for (const d of nodes) {
      const c = d.m.community ?? 0;
      if (!cs.has(c)) cs.set(c, cs.size);
    }
    const N = cs.size, R = 90 + n * 1.6;
    const cxy = new Map([...cs].map(([c, i]) => [c,
      [Math.cos(i / N * 2 * Math.PI) * R, Math.sin(i / N * 2 * Math.PI) * R]]));
    S.sim.force("cx", d3.forceX(d => cxy.get(d.m.community ?? 0)[0]).strength(.16))
      .force("cy", d3.forceY(d => cxy.get(d.m.community ?? 0)[1]).strength(.16));
  }
  setTimeout(fit, 700);
}

/** Where each connected component should sit: the largest in the middle, the
    rest ringed around it, so a handful of stray pairs cannot hijack the frame. */
function componentHomes(nodes) {
  const sizes = new Map();
  for (const d of nodes) sizes.set(d.comp ?? 0, (sizes.get(d.comp ?? 0) || 0) + 1);
  const order = [...sizes.entries()].sort((a, b) => b[1] - a[1]);
  const home = new Map();
  if (!order.length) return home;
  const [mainId, mainSize] = order[0];
  home.set(mainId, [0, 0, 0.012]);
  const R = 46 * Math.sqrt(mainSize) + 90;
  const rest = order.slice(1);
  // walk outward in rings, each component parked on its own slot
  let ring = 0, slot = 0, perRing = Math.max(6, Math.round(2 * Math.PI * R / 120));
  for (const [cid, size] of rest) {
    const rr = R + ring * 130;
    const a = (slot / perRing) * Math.PI * 2 + ring * 0.5;
    home.set(cid, [Math.cos(a) * rr, Math.sin(a) * rr, 0.14 + 0.5 / Math.sqrt(size + 1)]);
    if (++slot >= perRing) { slot = 0; ring++; perRing = Math.max(6, Math.round(2 * Math.PI * (R + ring * 130) / 120)); }
  }
  return home;
}

function visibleLinks() {
  const th = S.view.threshold;
  const only = S.view.onlyPicked && S.picked.size;
  return S.G.links.filter(l => l.w >= th && !isHidden(l.source) && !isHidden(l.target) &&
    (!only || (S.picked.has(l.s) && S.picked.has(l.t))));
}
function visibleNodes() {
  let ns = S.G.nodes.filter(n => !isHidden(n));
  if (S.view.onlyPicked && S.picked.size) ns = ns.filter(n => S.picked.has(n.id));
  if (S.view.hideIsolates) {
    const live = new Set();
    for (const L of visibleLinks()) { live.add(L.s); live.add(L.t); }
    ns = ns.filter(n => live.has(n.id));
  }
  return ns;
}
function isHidden(n) {
  const cf = S.view.compFilter;
  if (cf != null && cf !== "all") {
    const want = cf === "largest" ? largestComponentId() : cf;
    if (n.comp !== want) return true;
  }
  const key = S.view.colorBy;
  if (key === "__none__" || !S.view.hidden.size) return false;
  const v = key === "__community__" ? "C" + (n.m.community ?? 0) : (n.attrs[key] ?? "—");
  return S.view.hidden.has(String(v));
}
function largestComponentId() {
  if (S._bigComp != null) return S._bigComp;
  const size = new Map();
  for (const n of S.G.nodes) size.set(n.comp, (size.get(n.comp) || 0) + 1);
  let best = 0, bestN = -1;
  for (const [id, sz] of size) if (sz > bestN) { bestN = sz; best = id; }
  return (S._bigComp = best);
}
function componentSizes() {
  const size = new Map();
  for (const n of S.G.nodes) size.set(n.comp, (size.get(n.comp) || 0) + 1);
  return [...size.entries()].sort((a, b) => b[1] - a[1]);
}

/* ========================================================== RENDERING ==== */
let DPR = Math.min(window.devicePixelRatio || 1, 2);
function sizeCanvas() {
  const r = STAGE.getBoundingClientRect();
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  CANVAS.width = Math.round(r.width * DPR);
  CANVAS.height = Math.round(r.height * DPR);
  CANVAS.style.width = r.width + "px";
  CANVAS.style.height = r.height + "px";
  draw();
}
window.addEventListener("resize", sizeCanvas);

function radiusOf(d) {
  const key = S.view.sizeBy;
  if (key === "__uniform__") return 5 * S.view.sizeScale;
  const v = d.m[key];
  if (v == null) return 5 * S.view.sizeScale;
  const ext = S.sizeExtent?.[key];
  if (!ext) return 5 * S.view.sizeScale;
  const t = ext[1] > ext[0] ? (v - ext[0]) / (ext[1] - ext[0]) : 0;
  return (3.2 + 13 * Math.sqrt(t)) * S.view.sizeScale;
}
function refreshSizeExtent() {
  S.sizeExtent = {};
  if (!S.G) return;
  const keys = new Set(["degree", "strength"]);
  for (const n of S.G.nodes) for (const k in n.m) keys.add(k);
  for (const k of keys) {
    let lo = Infinity, hi = -Infinity;
    for (const n of S.G.nodes) {
      const v = n.m[k];
      if (typeof v === "number" && Number.isFinite(v)) { if (v < lo) lo = v; if (v > hi) hi = v; }
    }
    if (lo <= hi) S.sizeExtent[k] = [lo, hi];
  }
}

function colourOf(d) {
  const key = S.view.colorBy;
  if (key === "__none__") return "#5b7fa6";
  if (key === "__community__") {
    const c = d.m.community;
    return c == null ? "#b8c0cc" : PALETTE[c % PALETTE.length];
  }
  const v = d.attrs[key];
  return (v == null || v === "") ? "#c3cad4" : (S.palette[v] || "#c3cad4");
}

function draw() {
  const w = CANVAS.width, h = CANVAS.height;
  CTX.save();
  CTX.setTransform(1, 0, 0, 1, 0, 0);
  CTX.fillStyle = S.view.dark ? "#12161c" : "#ffffff";
  CTX.fillRect(0, 0, w, h);
  if (!S.G) { CTX.restore(); return; }
  CTX.scale(DPR, DPR);
  CTX.translate(S.tf.x, S.tf.y);
  CTX.scale(S.tf.k, S.tf.k);
  paint(CTX, S.tf.k);
  CTX.restore();

  if (S.box) {                                 // the marquee, drawn in screen space
    const [x0, y0, x1, y1] = S.box;
    CTX.save();
    CTX.setTransform(DPR, 0, 0, DPR, 0, 0);
    CTX.fillStyle = "rgba(47,95,208,.10)";
    CTX.strokeStyle = "#2f5fd0";
    CTX.lineWidth = 1;
    CTX.setLineDash([4, 3]);
    CTX.fillRect(Math.min(x0, x1), Math.min(y0, y1), Math.abs(x1 - x0), Math.abs(y1 - y0));
    CTX.strokeRect(Math.min(x0, x1) + .5, Math.min(y0, y1) + .5, Math.abs(x1 - x0), Math.abs(y1 - y0));
    CTX.restore();
  }
}

/* the single painting routine, shared by the screen and by PNG export */
function paint(ctx, k) {
  const V = S.view;
  const links = visibleLinks();
  const nodes = visibleNodes();
  const ego = S.selected ? new Set([S.selected.id, ...S.G.adj.get(S.selected.id).map(e => e.o)]) : null;
  const maxW = Math.max(1, maxOf(links, l => l.w));

  // ---- edges
  ctx.lineCap = "round";
  for (const L of links) {
    const dim = ego && !(ego.has(L.s) && ego.has(L.t));
    const hot = S.hoverLink === L;
    ctx.globalAlpha = hot ? .95 : dim ? V.edgeOpacity * .12 : V.edgeOpacity;
    ctx.strokeStyle = hot ? "#e4572e" : (V.dark ? "#8fa3bd" : "#6f7d90");
    ctx.lineWidth = ((0.35 + 2.4 * Math.sqrt(L.w / maxW)) * V.edgeWidth) / Math.max(k, .35);
    ctx.beginPath();
    ctx.moveTo(L.source.x, L.source.y);
    if (V.curved) {
      const mx = (L.source.x + L.target.x) / 2, my = (L.source.y + L.target.y) / 2;
      const dx = L.target.x - L.source.x, dy = L.target.y - L.source.y;
      ctx.quadraticCurveTo(mx - dy * .12, my + dx * .12, L.target.x, L.target.y);
    } else ctx.lineTo(L.target.x, L.target.y);
    ctx.stroke();
    if (S.map?.directed && k > .55) drawArrow(ctx, L, k);
  }

  // ---- nodes
  ctx.globalAlpha = 1;
  for (const d of nodes) {
    const dim = ego && !ego.has(d.id);
    const r = radiusOf(d);
    ctx.globalAlpha = dim ? .18 : 1;
    ctx.beginPath();
    ctx.arc(d.x, d.y, r, 0, 6.2832);
    ctx.fillStyle = colourOf(d);
    ctx.fill();
    ctx.lineWidth = (d === S.hover || d === S.selected ? 2.4 : .9) / Math.max(k, .4);
    ctx.strokeStyle = d === S.hover || d === S.selected ? "#111826"
      : (V.dark ? "rgba(255,255,255,.35)" : "rgba(255,255,255,.9)");
    ctx.stroke();
    if (S.picked.has(d.id) && !V.onlyPicked) {   // marked for export
      // (rings are pointless while Isolate is on: every visible node is marked)
      ctx.beginPath(); ctx.arc(d.x, d.y, r + 4.5 / Math.max(k, .4), 0, 6.2832);
      ctx.strokeStyle = "#e4572e";
      ctx.lineWidth = 2.2 / Math.max(k, .4);
      ctx.stroke();
    }
    if (d.fx != null) {                       // pinned marker
      ctx.beginPath(); ctx.arc(d.x, d.y, r + 3 / Math.max(k, .4), 0, 6.2832);
      ctx.strokeStyle = "#e4572e"; ctx.lineWidth = 1.2 / Math.max(k, .4);
      ctx.setLineDash([2 / k, 2 / k]); ctx.stroke(); ctx.setLineDash([]);
    }
  }

  // ---- labels
  ctx.globalAlpha = 1;
  const placed = placeLabels(nodes, k);
  if (placed.length) {
    const fs = V.labelSize / Math.max(k, .28);
    ctx.font = `${fs}px -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif`;
    ctx.textAlign = "center"; ctx.textBaseline = "top";
    ctx.lineJoin = "round";
    for (const { node: d, y } of placed) {
      const dim = ego && !ego.has(d.id);
      ctx.globalAlpha = dim ? .16 : 1;
      ctx.lineWidth = 3.4 / Math.max(k, .4);
      ctx.strokeStyle = V.dark ? "rgba(18,22,28,.92)" : "rgba(255,255,255,.92)";
      ctx.strokeText(d.label, d.x, y);
      ctx.fillStyle = V.dark ? "#e8edf4" : "#1b1f26";
      ctx.fillText(d.label, d.x, y);
    }
  }
  ctx.globalAlpha = 1;
}

/** Decide which labels actually get drawn: most important first, and a label
    is dropped when it would land on top of one already placed. */
function placeLabels(nodes, k) {
  const V = S.view;
  const wanted = labelSet(nodes);
  if (!wanted.size) return [];
  const fs = V.labelSize / Math.max(k, .28);
  CTX.save();
  CTX.font = `${fs}px -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif`;
  const rankKey = S.sizeExtent?.[V.sizeBy] ? V.sizeBy : "degree";
  const list = nodes.filter(d => wanted.has(d.id))
    .sort((a, b) => (b.m[rankKey] ?? 0) - (a.m[rankKey] ?? 0));
  const boxes = [], out = [];
  const pad = 1.5 / Math.max(k, .4);
  for (const d of list) {
    const w = CTX.measureText(d.label).width;
    const y = d.y + radiusOf(d) + 2 / Math.max(k, .4);
    const box = [d.x - w / 2 - pad, y - pad, d.x + w / 2 + pad, y + fs + pad];
    const always = d === S.hover || d === S.selected;
    if (!always && boxes.some(b => box[0] < b[2] && box[2] > b[0] && box[1] < b[3] && box[3] > b[1])) continue;
    boxes.push(box);
    out.push({ node: d, y, w, fs });
  }
  CTX.restore();
  return out;
}

function drawArrow(ctx, L, k) {
  const r = radiusOf(L.target);
  const dx = L.target.x - L.source.x, dy = L.target.y - L.source.y;
  const len = Math.hypot(dx, dy) || 1;
  const ux = dx / len, uy = dy / len;
  const tipX = L.target.x - ux * (r + 1), tipY = L.target.y - uy * (r + 1);
  const a = 6 / Math.max(k, .5);
  ctx.beginPath();
  ctx.moveTo(tipX, tipY);
  ctx.lineTo(tipX - ux * a - uy * a * .45, tipY - uy * a + ux * a * .45);
  ctx.lineTo(tipX - ux * a + uy * a * .45, tipY - uy * a - ux * a * .45);
  ctx.closePath();
  ctx.fillStyle = ctx.strokeStyle;
  ctx.fill();
}

function labelSet(nodes) {
  const V = S.view;
  if (V.labelMode === "none") return new Set();
  if (V.labelMode === "all") return new Set(nodes.map(n => n.id));
  const key = S.sizeExtent?.[V.sizeBy] ? V.sizeBy : "degree";
  const top = [...nodes].sort((a, b) => (b.m[key] ?? 0) - (a.m[key] ?? 0)).slice(0, V.labelTop);
  const s = new Set(top.map(n => n.id));
  if (S.selected) { s.add(S.selected.id); for (const e of S.G.adj.get(S.selected.id)) s.add(e.o); }
  if (S.hover) s.add(S.hover.id);
  return s;
}

/* ========================================================= INTERACTION == */
const zoom = d3.zoom().scaleExtent([0.02, 14])
  // the wheel always zooms; a drag pans unless we are marquee-selecting
  .filter(ev => ev.type === "wheel" ? true : !(ev.button || S.selectMode || ev.shiftKey))
  .on("zoom", ev => { S.tf = ev.transform; draw(); });
d3.select(CANVAS).call(zoom).on("dblclick.zoom", null);

function fit(pad = 60) {
  if (!S.G || !S.G.nodes.length) return;
  const ns = visibleNodes().length ? visibleNodes() : S.G.nodes;
  const x0 = minOf(ns, d => d.x), x1 = maxOf(ns, d => d.x);
  const y0 = minOf(ns, d => d.y), y1 = maxOf(ns, d => d.y);
  const r = STAGE.getBoundingClientRect();
  const k = Math.min(8, 0.95 * Math.min((r.width - pad * 2) / Math.max(x1 - x0, 1),
    (r.height - pad * 2) / Math.max(y1 - y0, 1)));
  const t = d3.zoomIdentity
    .translate(r.width / 2 - k * (x0 + x1) / 2, r.height / 2 - k * (y0 + y1) / 2)
    .scale(k);
  d3.select(CANVAS).transition().duration(400).call(zoom.transform, t);
}
$("#zin").onclick = () => d3.select(CANVAS).transition().duration(220).call(zoom.scaleBy, 1.5);
$("#zout").onclick = () => d3.select(CANVAS).transition().duration(220).call(zoom.scaleBy, 1 / 1.5);
$("#zfit").onclick = () => fit();

function atPoint(mx, my) {
  if (!S.G) return { node: null, link: null };
  const p = S.tf.invert([mx, my]);
  let best = null, bestD = Infinity;
  for (const d of visibleNodes()) {
    const r = radiusOf(d) + 4 / S.tf.k;
    const dd = (d.x - p[0]) ** 2 + (d.y - p[1]) ** 2;
    if (dd < r * r && dd < bestD) { best = d; bestD = dd; }
  }
  if (best) return { node: best, link: null };
  // nearest edge within a few pixels
  const tol = 5 / S.tf.k;
  let bl = null, blD = tol;
  for (const L of visibleLinks()) {
    const d = distToSeg(p[0], p[1], L.source.x, L.source.y, L.target.x, L.target.y);
    if (d < blD) { blD = d; bl = L; }
  }
  return { node: null, link: bl };
}
function distToSeg(px, py, x1, y1, x2, y2) {
  const dx = x2 - x1, dy = y2 - y1, L2 = dx * dx + dy * dy;
  let t = L2 ? ((px - x1) * dx + (py - y1) * dy) / L2 : 0;
  t = Math.max(0, Math.min(1, t));
  return Math.hypot(px - (x1 + t * dx), py - (y1 + t * dy));
}

let dragging = null, dragMoved = false, boxAdd = false;
CANVAS.addEventListener("pointermove", e => {
  const r = CANVAS.getBoundingClientRect();
  const mx = e.clientX - r.left, my = e.clientY - r.top;
  if (S.box) { S.box[2] = mx; S.box[3] = my; draw(); TIP.style.display = "none"; return; }
  if (dragging) {
    dragMoved = true;
    const p = S.tf.invert([mx, my]);
    dragging.fx = dragging.x = p[0];
    dragging.fy = dragging.y = p[1];
    if (S.sim) S.sim.alphaTarget(.22).restart(); else draw();
    return;
  }
  const { node, link } = atPoint(mx, my);
  if (node !== S.hover || link !== S.hoverLink) {
    S.hover = node; S.hoverLink = link;
    CANVAS.style.cursor = node ? "pointer" : link ? "crosshair" : "default";
    draw();
  }
  if (node) showTip(nodeTip(node), e.clientX, e.clientY);
  else if (link) showTip(linkTip(link), e.clientX, e.clientY);
  else TIP.style.display = "none";
});
CANVAS.addEventListener("pointerleave", () => {
  S.hover = S.hoverLink = null; TIP.style.display = "none"; draw();
});
CANVAS.addEventListener("pointerdown", e => {
  const r = CANVAS.getBoundingClientRect();
  const mx = e.clientX - r.left, my = e.clientY - r.top;
  const { node } = atPoint(mx, my);
  if (node && (e.shiftKey || e.metaKey || e.ctrlKey)) {   // add or remove from the marked group
    S.picked.has(node.id) ? S.picked.delete(node.id) : S.picked.add(node.id);
    renderSelectionBar(); renderExportPanel(); draw();
    e.stopPropagation();
    return;
  }
  if (node) {
    dragging = node; dragMoved = false;
    CANVAS.setPointerCapture(e.pointerId);
    e.stopPropagation();
    return;
  }
  if (S.selectMode || e.shiftKey) {                       // start a marquee
    boxAdd = e.shiftKey || e.metaKey || e.ctrlKey;
    S.box = [mx, my, mx, my];
    CANVAS.setPointerCapture(e.pointerId);
    e.stopPropagation();
  }
});
CANVAS.addEventListener("pointerup", e => {
  if (S.box) {
    const [x0, y0, x1, y1] = S.box;
    S.box = null;
    if (Math.abs(x1 - x0) > 3 && Math.abs(y1 - y0) > 3) {
      const a = S.tf.invert([Math.min(x0, x1), Math.min(y0, y1)]);
      const b = S.tf.invert([Math.max(x0, x1), Math.max(y0, y1)]);
      if (!boxAdd) S.picked.clear();
      for (const d of visibleNodes())
        if (d.x >= a[0] && d.x <= b[0] && d.y >= a[1] && d.y <= b[1]) S.picked.add(d.id);
      renderSelectionBar(); renderExportPanel();
    }
    draw();
    return;
  }
  if (dragging) {
    if (S.sim) S.sim.alphaTarget(0);
    if (!dragMoved) {                       // a click, not a drag → toggle ego view
      S.selected = S.selected === dragging ? null : dragging;
      dragging.fx = dragging.fy = null;
      renderAnalysisSelection();
    }
    dragging = null; draw();
  }
});
CANVAS.addEventListener("dblclick", e => {
  const r = CANVAS.getBoundingClientRect();
  const { node } = atPoint(e.clientX - r.left, e.clientY - r.top);
  if (node) { node.fx = node.fy = null; if (S.sim) S.sim.alpha(.3).restart(); draw(); }
});

function showTip(html, cx, cy) {
  TIP.innerHTML = html;
  TIP.style.display = "block";
  const r = STAGE.getBoundingClientRect(), tr = TIP.getBoundingClientRect();
  let x = cx - r.left + 14, y = cy - r.top + 14;
  if (x + tr.width > r.width - 8) x = cx - r.left - tr.width - 14;
  if (y + tr.height > r.height - 8) y = cy - r.top - tr.height - 14;
  TIP.style.left = Math.max(6, x) + "px";
  TIP.style.top = Math.max(6, y) + "px";
}
const METRIC_LABEL = {
  degree: "Degree", strength: "Weighted degree", betweenness: "Betweenness",
  closeness: "Closeness", eigenvector: "Eigenvector", pagerank: "PageRank",
  clustering: "Clustering", kcore: "k-core", community: "Community"
};
function nodeTip(d) {
  const rows = [];
  rows.push(["Connections", d.deg]);
  if (S.map.weightCol !== "__count__" || S.map.mode === "co") rows.push(["Total weight", fmt(d.str)]);
  for (const k of Object.keys(d.attrs)) rows.push([k, d.attrs[k]]);
  for (const k of ["betweenness", "closeness", "eigenvector", "pagerank", "clustering", "kcore"])
    if (d.m[k] != null) rows.push([METRIC_LABEL[k], fmt(d.m[k], 4)]);
  if (d.m.community != null) rows.push(["Community", "#" + (d.m.community + 1)]);
  return `<div class="t">${esc(d.label)}</div>` +
    rows.map(([k, v]) => `<div><span class="k">${esc(k)}:</span> ${esc(String(v).slice(0, 120))}</div>`).join("");
}
function linkTip(L) {
  const rows = [["Weight", fmt(L.w)], ["Rows behind it", L.n]];
  if (L.groups?.length) rows.push([S.map.b, L.groups.slice(0, 8).join("; ") + (L.groups.length > 8 ? ` …(+${L.groups.length - 8})` : "")]);
  for (const k in L.info) if (!L.groups?.length || k !== S.map.b)
    rows.push([k, L.info[k].slice(0, 8).join("; ") + (L.info[k].length > 8 ? " …" : "")]);
  return `<div class="t">${esc(L.source.label)} ${S.map.directed ? "→" : "—"} ${esc(L.target.label)}</div>` +
    rows.map(([k, v]) => `<div><span class="k">${esc(k)}:</span> ${esc(String(v).slice(0, 160))}</div>`).join("");
}

/* ------------------------------------------------------------- search --- */
const searchBox = $("#search"), hits = $("#hits");
searchBox.addEventListener("input", () => {
  const q = normKey(searchBox.value);
  if (!q || !S.G) { hits.style.display = "none"; return; }
  const found = S.G.nodes.filter(n => n.id.includes(q)).slice(0, 40);
  hits.innerHTML = found.length
    ? found.map(n => `<div data-id="${esc(n.id)}">${esc(n.label)} <span style="color:#8a93a2">· ${n.deg} links</span></div>`).join("")

/* ============================================================ METRICS ==== */
/* A compact CSR-style index so the algorithms run over plain typed arrays. */
function graphIndex(useThreshold = true) {
  const nodes = S.G.nodes;
  const idx = new Map(nodes.map((n, i) => [n.id, i]));
  const N = nodes.length;
  const head = Array.from({ length: N }, () => []);
  const links = useThreshold ? visibleLinks() : S.G.links;
  for (const L of links) {
    const a = idx.get(L.s), b = idx.get(L.t);
    if (a == null || b == null) continue;
    head[a].push([b, L.w]);
    if (!(S.map.mode === "edges" && S.map.directed)) head[b].push([a, L.w]);
    else head[b];                                   // directed: only a → b
  }
  return { nodes, idx, N, head, links };
}

/** Dijkstra / BFS from one source. Returns {dist, sigma, order, preds}. */
function sssp(head, N, s, weighted) {
  const dist = new Float64Array(N).fill(Infinity);
  const sigma = new Float64Array(N);
  const preds = Array.from({ length: N }, () => []);
  const order = [];
  dist[s] = 0; sigma[s] = 1;

  if (!weighted) {
    const q = [s]; let qi = 0;
    while (qi < q.length) {
      const v = q[qi++]; order.push(v);
      for (const [w] of head[v]) {
        if (dist[w] === Infinity) { dist[w] = dist[v] + 1; q.push(w); }
        if (dist[w] === dist[v] + 1) { sigma[w] += sigma[v]; preds[w].push(v); }
      }
    }
    return { dist, sigma, order, preds };
  }
  // weighted: shorter distance for a stronger tie → d = 1/w
  const heap = [[0, s]];
  const done = new Uint8Array(N);
  const push = (d, v) => {
    heap.push([d, v]);
    let i = heap.length - 1;
    while (i > 0) { const p = (i - 1) >> 1; if (heap[p][0] <= heap[i][0]) break; [heap[p], heap[i]] = [heap[i], heap[p]]; i = p; }
  };
  const pop = () => {
    const top = heap[0], last = heap.pop();
    if (heap.length) {
      heap[0] = last; let i = 0;
      for (; ;) {
        const l = 2 * i + 1, r = l + 1; let m = i;
        if (l < heap.length && heap[l][0] < heap[m][0]) m = l;
        if (r < heap.length && heap[r][0] < heap[m][0]) m = r;
        if (m === i) break;
        [heap[m], heap[i]] = [heap[i], heap[m]]; i = m;
      }
    }
    return top;
  };
  while (heap.length) {
    const [d, v] = pop();
    if (done[v]) continue;
    done[v] = 1; order.push(v);
    for (const [w, wt] of head[v]) {
      const nd = d + (wt > 0 ? 1 / wt : 1e9);
      if (nd < dist[w] - 1e-12) { dist[w] = nd; sigma[w] = sigma[v]; preds[w] = [v]; push(nd, w); }
      else if (Math.abs(nd - dist[w]) < 1e-12) { sigma[w] += sigma[v]; preds[w].push(v); }
    }
  }
  return { dist, sigma, order, preds };
}

const METRICS = {
  betweenness: {
    name: "Betweenness centrality",
    heavy: true,
    run(G, weighted) {
      const { N, head } = G;
      const bc = new Float64Array(N);
      for (let s = 0; s < N; s++) {
        const { sigma, order, preds } = sssp(head, N, s, weighted);
        const delta = new Float64Array(N);
        for (let i = order.length - 1; i >= 0; i--) {
          const w = order[i];
          for (const v of preds[w]) delta[v] += (sigma[v] / sigma[w]) * (1 + delta[w]);
          if (w !== s) bc[w] += delta[w];
        }
      }
      // Undirected traversal visits every pair twice, so the same divisor
      // normalises both cases and matches NetworkX's normalised values.
      const scale = N > 2 ? 1 / ((N - 1) * (N - 2)) : 1;
      const out = {};
      G.nodes.forEach((n, i) => out[n.id] = bc[i] * scale);
      return out;
    }
  },
  closeness: {
    name: "Closeness centrality",
    heavy: true,
    run(G, weighted) {
      const { N, head } = G;
      const out = {};
      for (let s = 0; s < N; s++) {
        const { dist } = sssp(head, N, s, weighted);
        let sum = 0, reach = 0;
        for (let i = 0; i < N; i++) if (i !== s && Number.isFinite(dist[i])) { sum += dist[i]; reach++; }
        // Wasserman–Faust correction so nodes in small components are not flattered
        out[G.nodes[s].id] = (sum > 0 && N > 1) ? (reach / sum) * (reach / (N - 1)) : 0;
      }
      return out;
    }
  },
  eigenvector: {
    name: "Eigenvector centrality",
    run(G, weighted) {
      const { N, head } = G;
      let x = new Float64Array(N).fill(1 / Math.sqrt(N));
      for (let it = 0; it < 300; it++) {
        const y = new Float64Array(N);
        for (let v = 0; v < N; v++) for (const [w, wt] of head[v]) y[w] += x[v] * (weighted ? wt : 1);
        let norm = 0; for (let i = 0; i < N; i++) norm += y[i] * y[i]; norm = Math.sqrt(norm);
        if (!norm || !Number.isFinite(norm)) { norm = 1; }
        let diff = 0;
        for (let i = 0; i < N; i++) { const nv = y[i] / norm; diff += Math.abs(nv - x[i]); x[i] = nv; }
        if (diff < 1e-9) break;
      }
      const mx = maxOf(x) || 1;
      const out = {};
      G.nodes.forEach((n, i) => out[n.id] = x[i] / mx);
      return out;
    }
  },
  pagerank: {
    name: "PageRank",
    run(G, weighted) {
      const { N, head } = G, d = 0.85;
      const outW = new Float64Array(N);
      for (let v = 0; v < N; v++) for (const [, wt] of head[v]) outW[v] += weighted ? wt : 1;
      let x = new Float64Array(N).fill(1 / N);
      for (let it = 0; it < 200; it++) {
        const y = new Float64Array(N).fill((1 - d) / N);
        let dangling = 0;
        for (let v = 0; v < N; v++) {
          if (outW[v] === 0) { dangling += x[v]; continue; }
          for (const [w, wt] of head[v]) y[w] += d * x[v] * ((weighted ? wt : 1) / outW[v]);
        }
        if (dangling) for (let i = 0; i < N; i++) y[i] += d * dangling / N;
        let diff = 0;
        for (let i = 0; i < N; i++) { diff += Math.abs(y[i] - x[i]); }
        x = y;
        if (diff < 1e-12) break;
      }
      const out = {};
      G.nodes.forEach((n, i) => out[n.id] = x[i]);
      return out;
    }
  },
  clustering: {
    name: "Clustering coefficient",
    run(G) {
      const { N, head } = G;
      const sets = head.map(h => new Set(h.map(e => e[0])));
      const out = {};
      for (let v = 0; v < N; v++) {
        const nb = [...sets[v]].filter(u => u !== v);
        const k = nb.length;
        if (k < 2) { out[G.nodes[v].id] = 0; continue; }
        let tri = 0;
        for (let i = 0; i < k; i++) for (let j = i + 1; j < k; j++) if (sets[nb[i]].has(nb[j])) tri++;
        out[G.nodes[v].id] = (2 * tri) / (k * (k - 1));
      }
      return out;
    }
  },
  kcore: {
    name: "k-core",
    run(G) {
      const { N, head } = G;
      const sets = head.map(h => new Set(h.map(e => e[0])));
      const deg = sets.map((s, i) => { s.delete(i); return s.size; });
      const core = new Int32Array(N);
      const alive = new Uint8Array(N).fill(1);
      const order = [...Array(N).keys()];
      let k = 0, left = N;
      while (left > 0) {
        let changed = true;
        while (changed) {
          changed = false;
          for (const v of order) {
            if (alive[v] && deg[v] <= k) {
              alive[v] = 0; core[v] = k; left--; changed = true;
              for (const u of sets[v]) if (alive[u]) deg[u]--;
            }
          }
        }
        k++;
        if (k > N) break;
      }
      const out = {};
      G.nodes.forEach((n, i) => out[n.id] = core[i]);
      return out;
    }
  }
};

/* ------------------------------------------------------------- Louvain -- */
function louvain(G) {
  const { N, head } = G;
  // collapse to a simple weighted adjacency
  let adj = head.map(h => {
    const m = new Map();
    for (const [w, wt] of h) m.set(w, (m.get(w) || 0) + wt);
    return m;
  });
  let m2 = 0;                                          // 2m
  for (let v = 0; v < N; v++) for (const [, w] of adj[v]) m2 += w;
  if (m2 === 0) { const o = {}; G.nodes.forEach(n => o[n.id] = 0); return { comm: o, Q: 0, count: 0 }; }

  let membership = [...Array(N).keys()];               // node -> community at top level
  let nodeMap = [...Array(N).keys()];                  // original node -> current super-node
  let n = N;

  for (let level = 0; level < 12; level++) {
    const k = new Float64Array(n);                     // weighted degree
    const self = new Float64Array(n);
    for (let v = 0; v < n; v++) for (const [u, w] of adj[v]) { k[v] += w; if (u === v) self[v] += w; }
    let comm = [...Array(n).keys()];
    const sTot = Float64Array.from(k);
    let improved = false, pass = 0;

    do {
      improved = false; pass++;
      const order = [...Array(n).keys()].sort(() => Math.random() - .5);
      for (const v of order) {
        const cv = comm[v];
        sTot[cv] -= k[v];
        const links = new Map();
        for (const [u, w] of adj[v]) if (u !== v) links.set(comm[u], (links.get(comm[u]) || 0) + w);
        let bestC = cv, bestGain = (links.get(cv) || 0) - sTot[cv] * k[v] / m2;
        for (const [c, w] of links) {
          const gain = w - sTot[c] * k[v] / m2;
          if (gain > bestGain + 1e-12) { bestGain = gain; bestC = c; }
        }
        sTot[bestC] += k[v];
        if (bestC !== cv) { comm[v] = bestC; improved = true; }
      }
    } while (improved && pass < 40);

    // renumber
    const remap = new Map();
    comm = comm.map(c => { if (!remap.has(c)) remap.set(c, remap.size); return remap.get(c); });
    const nc = remap.size;
    nodeMap = nodeMap.map(sn => comm[sn]);
    if (nc === n) break;                               // converged

    // aggregate
    const nadj = Array.from({ length: nc }, () => new Map());
    for (let v = 0; v < n; v++) for (const [u, w] of adj[v]) {
      const a = comm[v], b = comm[u];
      nadj[a].set(b, (nadj[a].get(b) || 0) + w);
    }
    adj = nadj; n = nc;
  }

  membership = nodeMap;
  // modularity of the final partition, measured on the original graph
  const kk = new Float64Array(N);
  for (let v = 0; v < N; v++) for (const [, w] of head[v].map(e => [e[0], e[1]])) kk[v] += w;
  const inW = new Map(), totW = new Map();
  for (let v = 0; v < N; v++) {
    const c = membership[v];
    totW.set(c, (totW.get(c) || 0) + kk[v]);
    for (const [u, w] of head[v]) if (membership[u] === c) inW.set(c, (inW.get(c) || 0) + w);
  }
  let Q = 0;
  for (const [c, tot] of totW) Q += (inW.get(c) || 0) / m2 - (tot / m2) ** 2;

  // order communities by size so #1 is the biggest
  const size = new Map();
  for (const c of membership) size.set(c, (size.get(c) || 0) + 1);
  const rank = new Map([...size.entries()].sort((a, b) => b[1] - a[1]).map(([c], i) => [c, i]));
  const out = {};
  G.nodes.forEach((nd, i) => out[nd.id] = rank.get(membership[i]));
  return { comm: out, Q, count: size.size };
}

/* ------------------------------------------------------- weak points ---- */
/** Articulation points (cut vertices): nodes whose removal breaks a component
    into pieces. For each one, report the sizes it would leave behind — the
    difference between a node that is merely busy and one the network depends on. */
function weakPoints(G) {
  const { N, head } = G;
  const adj = head.map(h => [...new Set(h.map(e => e[0]))]);
  const compOf = new Int32Array(N).fill(-1);
  const members = [];
  for (let s = 0; s < N; s++) {
    if (compOf[s] !== -1) continue;
    const q = [s], mem = []; compOf[s] = members.length;
    while (q.length) {
      const v = q.pop(); mem.push(v);
      for (const w of adj[v]) if (compOf[w] === -1) { compOf[w] = members.length; q.push(w); }
    }
    members.push(mem);
  }
  // pieces left inside a node's own component once it is removed
  const piecesWithout = (v) => {
    const mem = members[compOf[v]];
    const inSet = new Set(mem), seen = new Set([v]), out = [];
    for (const s of mem) {
      if (seen.has(s)) continue;
      const q = [s]; seen.add(s); let n = 0;
      while (q.length) {
        const u = q.pop(); n++;
        for (const w of adj[u]) if (inSet.has(w) && !seen.has(w)) { seen.add(w); q.push(w); }
      }
      out.push(n);
    }
    return out.sort((a, b) => b - a);
  };
  const out = [];
  for (let v = 0; v < N; v++) {
    if (adj[v].length < 2) continue;                 // a leaf can never be a cut point
    const p = piecesWithout(v);
    if (p.length > 1) out.push({
      node: G.nodes[v], pieces: p, was: members[compOf[v]].length,
      cutOff: p.slice(1).reduce((a, b) => a + b, 0),
      // how evenly it splits: 1 = perfectly in half, near 0 = shaves off a leaf
      evenness: +(p[1] / p[0]).toFixed(3)
    });
  }
  out.sort((a, b) => b.cutOff - a.cutOff || b.evenness - a.evenness);
  return out;
}

/* -------------------------------------------------------- graph stats --- */
function graphStats(G, weighted) {
  const { N, head, links } = G;
  const directed = S.map.mode === "edges" && S.map.directed;
  const E = links.length;
  const density = N > 1 ? (directed ? E / (N * (N - 1)) : 2 * E / (N * (N - 1))) : 0;

  // connected components (weak, for directed)
  const seen = new Int32Array(N).fill(-1);
  const comps = [];
  const undirected = head.map((h, i) => h.map(e => e[0]));
  if (directed) for (const L of links) {
    const a = G.idx.get(L.s), b = G.idx.get(L.t);
    undirected[b].push(a);
  }
  for (let s = 0; s < N; s++) {
    if (seen[s] !== -1) continue;
    const q = [s]; seen[s] = comps.length; let qi = 0, size = 0;
    while (qi < q.length) {
      const v = q[qi++]; size++;
      for (const w of undirected[v]) if (seen[w] === -1) { seen[w] = comps.length; q.push(w); }
    }
    comps.push(size);
  }
  // path statistics on the largest component (unweighted hops — the intuitive
  // reading). Components are numbered in discovery order, so the biggest one is
  // rarely number 0 — find it by size before measuring anything.
  let bigId = 0, bigSize = -1;
  const sizeOf = new Map();
  for (let i = 0; i < N; i++) sizeOf.set(seen[i], (sizeOf.get(seen[i]) || 0) + 1);
  for (const [id, sz] of sizeOf) if (sz > bigSize) { bigSize = sz; bigId = id; }
  const big = [];
  for (let i = 0; i < N; i++) if (seen[i] === bigId) big.push(i);

  comps.sort((a, b) => b - a);
  let diameter = null, avgPath = null;
  if (big.length > 1 && big.length <= 3000) {
    let sum = 0, cnt = 0, dia = 0;
    for (const s of big) {
      const { dist } = sssp(head, N, s, false);
      for (const t of big) if (t !== s && Number.isFinite(dist[t])) { sum += dist[t]; cnt++; if (dist[t] > dia) dia = dist[t]; }
    }
    avgPath = cnt ? sum / cnt : null; diameter = dia || null;
  }

  // global clustering (transitivity)
  const sets = head.map(h => new Set(h.map(e => e[0])));
  let triangles = 0, triples = 0;
  for (let v = 0; v < N; v++) {
    const nb = [...sets[v]].filter(u => u !== v);
    triples += nb.length * (nb.length - 1) / 2;
    for (let i = 0; i < nb.length; i++) for (let j = i + 1; j < nb.length; j++) if (sets[nb[i]].has(nb[j])) triangles++;
  }
  const transitivity = triples ? triangles / triples : 0;

  // degree assortativity (Pearson correlation of the degrees at each edge end)
  let sx = 0, sy = 0, sxy = 0, sx2 = 0, sy2 = 0, n2 = 0;
  for (const L of links) {
    const a = sets[G.idx.get(L.s)].size, b = sets[G.idx.get(L.t)].size;
    sx += a + b; sy += b + a; sxy += 2 * a * b; sx2 += a * a + b * b; sy2 += b * b + a * a; n2 += 2;
  }
  const degAssort = n2 ? (sxy / n2 - (sx / n2) * (sy / n2)) /
    Math.sqrt(Math.max(1e-12, (sx2 / n2 - (sx / n2) ** 2) * (sy2 / n2 - (sy / n2) ** 2))) : null;

  return {
    N, E, density, components: comps.length, largest: comps[0] || 0,
    isolates: comps.filter(c => c === 1).length,
    avgDegree: N ? 2 * E / N : 0, avgPath, diameter, transitivity, degAssort,
    triangles: triangles / 3
  };
}

/** Homophily: how often edges stay inside a category versus crossing it. */
function homophily(G, key) {
  const links = G.links;
  let internal = 0, external = 0, missing = 0;
  const byVal = new Map();
  for (const n of G.nodes) {
    const v = n.attrs[key];
    if (v == null || v === "") continue;
    byVal.set(v, (byVal.get(v) || 0) + 1);
  }
  const share = new Map([...byVal].map(([v, c]) => [v, c / [...byVal.values()].reduce((a, b) => a + b, 0)]));
  const perVal = new Map([...byVal.keys()].map(v => [v, { inside: 0, outside: 0 }]));
  for (const L of links) {
    const a = L.source.attrs[key], b = L.target.attrs[key];
    if (a == null || a === "" || b == null || b === "") { missing++; continue; }
    if (a === b) { internal++; perVal.get(a).inside++; }
    else { external++; perVal.get(a).outside++; perVal.get(b).outside++; }
  }
  const total = internal + external;
  const EI = total ? (external - internal) / total : null;
  // expected internal share if links were random, given the category sizes
  let expInternal = 0;
  for (const [, p] of share) expInternal += p * p;
  return {
    internal, external, missing, total, EI,
    observed: total ? internal / total : null, expected: expInternal,
    perVal: [...perVal.entries()].map(([v, o]) => ({
      value: v, n: byVal.get(v), inside: o.inside, outside: o.outside,
      rate: (o.inside + o.outside) ? o.inside / (o.inside + o.outside) : null
    })).sort((a, b) => b.n - a.n)
  };
}
